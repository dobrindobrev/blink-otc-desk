[package]
name = "otc_desk"
version = "3.0.0"
description = "Peer-to-peer OTC token desk: partial fills, expiry and Token-2022 support"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "otc_desk"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.1", features = ["init-if-needed"] }
anchor-spl = "1.2.1"

[dev-dependencies]
litesvm = "0.17.0"
proptest = "1"
solana-keypair = "3"
solana-message = "4"
solana-program-pack = "3"
solana-signer = "3"
solana-system-interface = { version = "3", features = ["bincode"] }
solana-transaction = "4"
spl-associated-token-account-interface = "2"
spl-token-2022-interface = "2.1.0"
spl-token-interface = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
